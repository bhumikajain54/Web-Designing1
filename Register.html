<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
            background-color: #f1f1f1;
            background-image: url(img/banner1.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            margin: 0;
        }
        
        .wrapper-container {
            width: 600px;
            max-width: 100%;
            min-height: auto;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            color: #1a70e7;
            font-size: 20px;
            font-family: 'Times New Roman', Times, serif;
            margin: 20px 0;
        }
        
        h2 {
            text-align: center;
            color: #1a70e7;
            margin-top: 0;
            margin-bottom: 20px;
        }
        
        .input-box {
            margin-bottom: 20px;
        }
        
        .input-box label {
            display: block;
            margin-bottom: 8px;
            color: #1a70e7;
            font-weight: bold;
        }
        
        .wrapper-container .input-box input,
        .wrapper-container .input-box textarea,
        .wrapper-container .input-box select {
            position: relative;
            width: 100%;
            height: 50px;
            border: 2px solid #1a70e7;
            border-radius: 6px;
            padding: 0px 15px;
            background-color: #ffffff;
            color: #000000;
            font-size: 16px;
            font-family: 'Times New Roman', Times, serif;
        }
        
        .wrapper-container .input-box textarea {
            height: 100px;
            padding: 15px;
            resize: vertical;
        }
        
        .wrapper-container .input-box select {
            cursor: pointer;
        }
        
        .input-box input[type=text],
        .input-box input[type=email],
        .input-box input[type=password],
        .input-box input[type=date],
        .input-box input[type=tel] {
            background-color: #ffffff;
            color: #000000;
        }
        
        .input-box input::placeholder,
        .input-box textarea::placeholder {
            color: #999999;
        }
        
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }
        
        .btn-container input[type=submit],
        .btn-container input[type=reset] {
            padding: 12px 30px;
            background-color: #1a70e7;
            color: white;
            border-radius: 10px;
            border: 2px solid #1a70e7;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .btn-container input[type=submit]:hover {
            background-color: #1556b8;
            border-color: #1556b8;
        }
        
        .btn-container input[type=reset] {
            background-color: #f1f1f1;
            color: #1a70e7;
            border-color: #1a70e7;
        }
        
        .btn-container input[type=reset]:hover {
            background-color: #e0e0e0;
        }
        
        .login-link {
            text-align: center;
            margin-top: 10px;
        }
        
        p {
            color: #1a70e7;
            margin-top: 10px;
        }
        
        a {
            color: #1a70e7;
            text-decoration: underline;
        }
        
        .Social-media {
            flex-basis: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        
        .Social-media a {
            display: inline-block;
            text-decoration: none;
            color: #1a70e7;
            font-size: 20px;
        }
        
        .Social-media a:hover {
            color: Black;
        }
    </style>
</head>

<body>
    <div class="wrapper-container">
        <h2>Registration Form</h2>
        <form action="/submit_registration" method="post">
            <div class="input-box">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>
            <div class="input-box">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="input-box">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="input-box">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
            </div>
            <div class="input-box">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
            </div>
            <div class="input-box">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
            </div>
            <div class="input-box">
                <label for="address">Address</label>
                <textarea id="address" name="address" placeholder="Enter your address" required></textarea>
            </div>
            <div class="input-box">
                <label for="country">Country</label>
                <input type="text" id="country" name="country" placeholder="Enter your country" required>
            </div>
            <div class="input-box">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="btn-container">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </div>
            <div class="login-link">
                <p>Already have an account? <a href="Login.html">Login</a></p>
            </div>
            <div class="Social-media">
                <a href="https://www.facebook.com/"><img src="img/facebook.png" alt="Facebook" width="50px" height="50px"></a>
                <a href="https://x.com/?lang=en"><img src="img/twitter1.png" alt="Twitter" width="50px" height="50px"></a>
                <a href="https://www.instagram.com/"><img src="img/instagram1.png" alt="Instagram" width="50px" height="50px"></a>
                <a href="https://www.youtube.com/"><img src="img/Youtude.png" alt="YouTube" width="50px" height="50px"></a>
            </div>
        </form>
    </div>
</body>

</html>
